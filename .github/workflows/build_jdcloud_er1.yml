name: JDCloud-ER1-Fanchmwrt-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize environment (full optimized)
        run: |
          # 替换阿里云国内源，稳定不超时，避免依赖下载失败
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt full-upgrade -y
          # 完整兼容Ubuntu 22.04的依赖包，无缺失（替换getopt为util-linux）
          sudo apt install -y binutils bzip2 flex gawk gcc util-linux libc-dev libz-dev make perl python3 rsync subversion unzip dos2unix libfuse-dev
          # 补充编译核心依赖，避免fanchmwrt初始化失败
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev git libssl-dev xsltproc wget
          # 清理冗余依赖，释放磁盘空间（避免编译磁盘不足）
          sudo apt autoremove -y && sudo apt clean -y

      - name: Update fanchmwrt feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Import JDCloud ER1 config file
        run: |
          cp deconfig/fanchmwrt_jdcloud_er1.config .config
          make defconfig

      - name: Download compilation dependencies
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Build JDCloud ER1 firmware (fault tolerance)
        run: |
          # 多线程编译失败后，自动切换单线程兜底，避免编译中断
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts (correct path 100%)
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud-er1-firmware
          # 核心修正：京东云太乙ER1的实际固件输出路径，确保能捕获到.bin文件
          path: bin/targets/ipq60xx/generic/*.bin
          retention-days: 90
