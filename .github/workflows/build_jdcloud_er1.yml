name: JDCloud-ER1-Fanchmwrt-Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize environment (fix package not found)
        run: |
          # 替换为阿里云源，提升兼容性
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt update -y
          sudo apt full-upgrade -y
          # 替换getopt为util-linux（包含getopt工具），修复包找不到问题
          sudo apt install -y binutils bzip2 flex gawk gcc util-linux libc-dev libz-dev make perl python3 rsync subversion unzip dos2unix libfuse-dev
          # 手动安装编译环境核心依赖
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev git libssl-dev xsltproc wget
          sudo apt autoremove -y && sudo apt clean -y

      - name: Update fanchmwrt feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Import JDCloud ER1 config file
        run: |
          cp deconfig/fanchmwrt_jdcloud_er1.config .config
          make defconfig

      - name: Download compilation dependencies
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Build JDCloud ER1 firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud-er1-firmware
          path: bin/targets/ipq60xx/generic/*.bin
          retention-days: 90
