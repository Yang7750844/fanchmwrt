name: RE-CS-07 Firmware Build (qualcommax/ipq60xx)
on:
  workflow_dispatch:
  push:
    branches: [ fanchmwrt-24.10.4 ]
    paths:
      - '.config'
      - '**.mk'
      - '**.sh'
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libssl-dev libncurses5-dev git wget curl subversion unzip gawk gettext libffi-dev python3 python3-pip python3-dev rsync time
      - name: Build firmware
        run: |
          make defconfig
          make -j$(nproc) V=s
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RE-CS-07-Firmware
          path: bin/targets/qualcommax/ipq60xx/*.bin
          retention-days: 30
